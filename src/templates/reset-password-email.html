<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Скидання пароля</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      background-color: #f4f4f5;
      padding: 20px;
    "
  >
    <div
      style="
        max-width: 600px;
        margin: 0 auto;
        background-color: #ffffff;
        padding: 30px;
        border-radius: 8px;
        border: 1px solid #e4e4e7;
      "
    >
      <h2 style="color: #18181b">Вітаємо, {{name}}!</h2>
      <p style="color: #3f3f46">
        Ви отримали цей лист, тому що надіслали запит на скидання пароля для
        вашого облікового запису.
      </p>
      <p style="color: #3f3f46">
        Для встановлення нового пароля перейдіть за посиланням нижче (воно
        дійсне протягом 15 хвилин):
      </p>
      <div style="margin: 30px 0; text-align: center">
        <a
          href="{{resetLink}}"
          style="
            background-color: #2563eb;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
          "
        >
          Скинути пароль
        </a>
      </div>
      <p style="color: #71717a; font-size: 14px">
        Якщо ви не надсилали цей запит, просто проігноруйте цей лист.
      </p>
    </div>
  </body>
</html>
